<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MergeBite 2048 - Game</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/game.css">
    <link rel="stylesheet" href="css/common.css">
</head>


<body>

    <main class="game-page">

        <div class="game-container">

            <nav class="game-topbar">
                <a href="mode.html" class="top-btn" title="Change mode" aria-label="Change mode">
                    <i class="bi bi-grid-fill"></i>
                </a>

                <h1 class="mode-title" id="modeTitle">Numbers</h1>

                <div class="top-actions">
                    <button type="button" class="top-btn" id="restartBtn" title="New game" aria-label="New game">
                        <i class="bi bi-arrow-repeat"></i>
                    </button>
                    <button type="button" class="top-btn" id="soundBtn">🔊</button>
                </div>
            </nav>

            <section class="game-header">

                <div class="score-card">
                    <span class="score-title">SCORE</span>
                    <span class="score-number" id="score">0</span>
                </div>

                <div class="next-wrapper">
                    <div class="next-card">
                        <div class="next-tile" id="nextTile"></div>
                    </div>
                    <span class="next-label">NEXT</span>
                </div>

                <div class="score-card">
                    <span class="score-title">BEST</span>
                    <span class="score-number" id="best">0</span>
                </div>

            </section>

            <!-- cells + tiles are generated by js/game.js -->
            <section class="game-board" id="board">
                <div class="tile-layer" id="tileLayer"></div>
            </section>

            <p class="game-goal" id="goal"></p>
            <div class="chain" id="chain" aria-label="Merge order"></div>

        </div>

    </main>

    <script src="js/common.js"></script>
    <script src="js/game.js"></script>
</body>

</html>
