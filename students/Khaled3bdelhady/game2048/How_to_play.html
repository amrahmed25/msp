<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How to Play - MergeBite 2048</title>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
        <link rel="stylesheet" href="css/How_to_play.css">
    <link rel="stylesheet" href="css/common.css">
</head>
<body>
    <div class="background-glow glow-1"></div>
    <div class="background-glow glow-2"></div>
    <div class="background-glow glow-3"></div>
    <main class="how-to-play-container">
        <section class="intro-section">

            <h1>
                How to Play:
                <span>A Guide to MergeBite 2048!</span>
            </h1>

            <p>
                Welcome to MergeBite, the most delicious way to puzzle.
            </p>

            <p>
                Master the art of merging to reach the ultimate feast!
            </p>

        </section>
         <div class="action-buttons">

           

            <a href="Home.html" class="btn-game btn-back">

                <i class="bi bi-arrow-left"></i>

                <span>Back to Home</span>

            </a>


           

            <a href="mode.html" class="btn-game btn-play">

                <span>Play Now</span>

                <i class="bi bi-controller"></i>

            </a>

        </div>
         <section class="game-modes">


            <div class="mode-card">

                <div class="mode-image-wrapper">

                    <img
                        src="images/number_card.png"
                        alt="Numbers Mode"
                        class="mode-image">

                </div>

            </div>


           

            <div class="mode-card">

                <div class="mode-image-wrapper">

                    <img
                        src="images/pie_card.png"
                        alt="Blueberry Pie Mode"
                        class="mode-image">

                </div>

            </div>

        </section>



    </main>
     <footer>

        <div class="footer-logo">
            MergeBite <span>2048</span>
        </div>

        <p>
            © 2026 MergeBite. All rights reserved.
        </p>

    </footer>
    
    <script src="js/common.js"></script>
</body>
</html>
