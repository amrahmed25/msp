<html lang="en">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

<body>
    <header class="navbar">
       <div class="logo">
            <h2 class="title-logo"><span>MergeBite 2048</span> </h2>
        </div>

    <nav class="nav">

        <a href="Home.html" class="nav-link ">
            
              <i class="bi bi-house-fill"></i>Home
        </a>

        <a href="mode.html" class="nav-link">
            
            <i class="bi bi-controller"></i> Game Mode
        </a>


        <a href="#" class="nav-link">
            <i class="bi bi-person-fill"></i> Profile
        </a>




    </nav>
    <button class="menu-btn" id="menuBtn">

    </button>

   
    <div class="header-buttons">

        <button class="icon-btn" id="soundBtn">

                <a href="game.html?mode=numbers" class="main-btn">
                    <span class="btn-icon">▶</span>

                </a>        
        </div>
 
 
        <div class="card2">
            <img src="images/cake2.png" alt="">

            <p>Merge fruits and create delicious treats!</p>

                <a href="game.html?mode=fruits" class="main-btn">
                    <span class="btn-icon">▶</span>
