<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="to_do_list.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
</head>
<body>



    <div class="main-container">
        <nav class="navbar">
            <div class="top">
                <button class="menu-toggle" id="menuToggle" type="button">
                    <i class="bi bi-list"></i>
                </button>            
                <div class="input-icon">
                    <i class="bi bi-mortarboard-fill"></i>
                            
                </div>  
                <div class="brand">
                    <h1>STUDENT LIFE</h1>
                    <p>MANAGEMENT SYSTEM</p>                    
                </div>

            </div> 
            <button class="theme-toggle" id="themeToggle" type="button">
                <i class="bi bi-sun-fill"></i>
            </button>
        </nav>
        <div class="container">

            <div class="sidebar">

                <a href="dashboard.html" class="side-cont">
                    <div class="input-icon">
                        <i class="bi bi-grid-1x2"></i>
                    </div>
                    <span>Dashboard</span>
                </a>

                <a href="schedule.html" class="side-cont">
                    <div class="input-icon">
                        <i class="bi bi-calendar-week"></i>
                    </div>
                    <span>Lecture Schedule</span>
                </a>

                <a href="study_plan.html" class="side-cont">
                    <div class="input-icon">
                        <i class="bi bi-journal-check"></i>
                    </div>
                    <span>Weekly Study Plan</span>
                </a>

                <a href="to_do_list.html" class="side-cont">
                    <div class="input-icon">
                        <i class="bi bi-check2-square"></i>
                    </div>
                    <span>To-Do List</span>
                </a>

                <a href="subjects.html" class="side-cont">
                    <div class="input-icon">
                        <i class="bi bi-book"></i>
                    </div>
                    <span>My Subjects</span>
                </a>

            </div>



            <div class="middle">
                <div class="page-heading">
                    <div class="input-icon2">
                        <i class="bi bi-check2-square"></i>
                                
                    </div>     
                    <div class="page-title">
                        <h1>To-Do List</h1>
                        <p>Manage your tasks for today and stay on track!</p>                    
                    </div>         
                </div>
                <div class="stats-container">
                    <div class="stat-card">
                        <div class="input-icons">
                            <i class="bi bi-list-task"></i>
                        </div>
                        <h3>Total Tasks: <span id="totalTasks">0</span></h3>
                    </div>

                    <div class="stat-card">
                        <div class="input-icons">
                            <i class="bi bi-check-circle-fill"></i>
                        </div>
                        <h3>Completed: <span id="completedTasks">0</span></h3>
                    </div>

                    <div class="stat-card">
                        <div class="input-icons">
                            <i class="bi bi-hourglass-split"></i>
                        </div>
                        <h3>Pending: <span id="pendingTasks">0</span></h3>
                    </div>

                    <div class="stat-card">
                        <div class="input-icons">
                            <i class="bi bi-exclamation-triangle-fill"></i>
                        </div>
                        <h3>High Priority: <span id="highPriorityTasks">0</span></h3>
                    </div>
                </div>

                <div class="task-form">
                    <div class="task-form-heading">
                        <div class="task-form-title">
                            <div class="input-icons">
                                <i class="bi bi-plus-lg"></i>
                            </div>
                            <h4>Add New Task</h4>
                        </div>
                        <p>Create a new task for today</p>

                    </div>

                    <div class="form-group">
                        <div class="form-field">
                            <div class="field-label">
                                <div class="input-icons">
                                    <i class="bi bi-card-text"></i>
                                </div>
                                <label for="task-name">Task name</label>
                            </div>
                            <input type="text" name="text" id="task-name" placeholder="Task name" >
                        </div>

                        <div class="form-field">
                            <div class="field-label">
                                <div class="input-icons">

                                    <i class="bi bi-book"></i>
                                        
                                </div>
                                <label for="Subjet">Subjet</label>
                            </div>
                            <select id="task-subject">
                                <option value="Select Subject" selected disabled >Select Subject</option>
                            </select>
                        </div>

                        <div class="form-field">
                            <div class="field-label">
                                <div class="input-icons">
                                    <i class="bi bi-clock"></i>
                                        
                                </div>
                                <label for="Duration">Duration</label>
                            </div>
                            <input type="number" placeholder="Duration with minutes" min="1" id="task-duration">
                        </div>

                        <div class="form-field">
                            <div class="field-label">
                                <div class="input-icons">
                                    <i class="bi bi-flag"></i>
                                        
                                </div>
                                <label for="Priority">Priority</label>
                            </div>
                            <select id="task-priority">
                                <option value="Priority" selected disabled >Priority</option>
                                <option value="High">High</option>
                                <option value="Medium">Medium</option>
                                <option value="Low">Low</option>
                            </select>
                        </div>            
                        
                        <div class="form-field">
                            <button type="button" id="addTaskBtn">+ Add Task</button>                        
                        </div>
                    </div>
                </div>



                <div class="tasks-section">
                    <div class="task-filters">
                        <button type="button" data-filter="All" class="active">All</button>
                        <button type="button" data-filter="Pending">Pending</button>
                        <button type="button" data-filter="Completed">Completed</button>
                        <button type="button" data-filter="High Priority">High Priority</button>
                    </div>

                    <div class="tasks-list" id="tasksList">

                    </div>
                </div>



            </div>


        </div>

    </div>


    <script src="main.js"></script>
    <script src="mode.js"></script>
</body>
</html>
