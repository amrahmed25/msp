<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-600 h-screen flex items-center justify-center">

    <div class="bg-blue-950 p-9 rounded-2xl shadow-2xl  w-96">
        <h2 class="text-2xl font-extrabold mb-6 text-center text-blue-400">Travel</h2>
        
        <form id="loginForm" class="flex flex-col gap-6">
            <input type="text" id="fullName" placeholder="Full Name" required 
                   class="bg-white p-3 rounded-xl ">
            
            <input type="email" id="email" placeholder="Email" required 
                   class="bg-white  p-3 rounded-xl">
            
            <input type="password" id="password" placeholder="Password" required 
                   class="bg-white  p-3 rounded-xl">
            
            <button type="submit" 
                    class="bg-blue-600 text-gray-100 font-extrabold py-2 rounded   hover:bg-blue-800 transition  hover:-translate-y-1 ">
                Login
            </button>
        </form>
        
    </div>

    <script>

       const loginForm = document.getElementById("loginForm");

       loginForm.addEventListener("submit", function(event) {
        event.preventDefault();

        const name = document.getElementById("fullName").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const destination = prompt("What is the favorite travel destination??");

        alert(`Welcome ${name} get ready to explore ${destination}`);

        console.log(name);
        console.log(email);
        console.log(password);

        window.location.href = "index2.html";

       });

    </script>


</body>
</html>
