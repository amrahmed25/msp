<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              cardDark: '#69a3ba',
              cardBorderDark: '#52899f',
              cellDark: '#bedf94',
              cardLight: '#8ecae6',
              cardBorderLight: '#219ebc',
              cellLight: '#d8f3dc',
              pX: '#ff6897',
              pO: '#51bdff',
            },
            fontFamily: {
              fredoka: ['Fredoka', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body class="font-fredoka select-none m-0 min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-800 to-slate-950 transition-colors duration-300">

    <div id="setupModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="bg-[#4f8297] border-4 border-[#38677b] text-white rounded-2xl p-6 w-full max-w-sm shadow-2xl flex flex-col gap-4">
            <h2 class="text-2xl font-black text-center text-yellow-200 tracking-wide drop-shadow">TIC TAC TOE</h2>
         
            <div class="flex gap-2 bg-[#38677b] p-1.5 rounded-xl">
                <button id="modeSingleBtn" class="flex-1 py-2 rounded-lg font-bold text-sm bg-yellow-400 text-slate-900 transition-all">Single Player</button>
                <button id="modeMultiBtn" class="flex-1 py-2 rounded-lg font-bold text-sm text-white hover:bg-white/10 transition-all">Multiplayer</button>
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-xs font-bold text-slate-200">Player 1 Name (X)</label>
                <input type="text" id="p1Input" value="" required class="bg-[#284c5e] text-white font-bold px-3 py-2 rounded-lg outline-none border-2 border-transparent focus:border-yellow-300 text-sm" placeholder="Enter Player 1 Name">
            </div>

            <div id="p2InputGroup" class="flex flex-col gap-1 hidden">
                <label class="text-xs font-bold text-slate-200">Player 2 Name (O)</label>
                <input type="text" id="p2Input" value="" required class="bg-[#284c5e] text-white font-bold px-3 py-2 rounded-lg outline-none border-2 border-transparent focus:border-yellow-300 text-sm" placeholder="Enter Player 2 Name">
            </div>

            <button id="startGameBtn" class="mt-2 bg-gradient-to-r from-green-400 to-emerald-500 hover:from-green-500 hover:to-emerald-600 text-slate-900 font-black py-3 rounded-xl shadow-lg active:scale-95 transition-all text-base">
                LET'S PLAY!
            </button>
        </div>
    </div>

    <div id="gameCard" class="relative w-full max-w-[420px] h-[680px] rounded-[20px] shadow-2xl flex flex-col justify-between p-5 border-4 bg-cardDark border-cardBorderDark transition-all duration-300">
        
        
        <div class="flex justify-between items-center w-full px-1">
            <button id="menuBtn" class="w-[46px] h-[46px] rounded-full flex items-center justify-center text-xl shadow-[inset_0_-3px_0_rgba(0,0,0,0.2)] active:scale-95 transition-transform bg-[#538ea6] text-[#2c596e]">
                <i class="fa-solid fa-gear"></i>
            </button>
            
            <div class="text-3xl font-black tracking-wider flex gap-1 drop-shadow-[0_3px_0_rgba(0,0,0,0.15)]">
                <span class="text-red-300">T</span>
                <span class="text-yellow-200">E</span>
                <span class="text-green-300">C</span>
                <span class="text-blue-300 ml-1">T</span>
                <span class="text-red-300">A</span>
                <span class="text-yellow-200">C</span>
                <span class="text-green-300 ml-1">T</span>
                <span class="text-blue-300">E</span>
                <span class="text-red-300">O</span>
            </div>

            <button id="themeToggleBtn" class="w-[46px] h-[46px] rounded-full flex items-center justify-center text-xl shadow-[inset_0_-3px_0_rgba(0,0,0,0.2)] active:scale-95 transition-transform bg-[#538ea6] text-[#2c596e]">
                <i id="themeIcon" class="fa-solid fa-moon"></i>
            </button>
        </div>

       
        <div id="menuModal" class="absolute top-[70px] left-5 bg-[#4f8297] border-3 border-[#38677b] rounded-[15px] p-[15px] z-40 shadow-2xl hidden flex-col gap-2.5 w-[210px]">
            <button id="changeSetupBtn" class="bg-[#38677b] text-white py-2 px-3 rounded-lg text-sm font-bold hover:opacity-90 transition-opacity">
                Change Mode / Names
            </button>
            <button id="resetScoreBtn" class="bg-[#38677b] text-white py-2 px-3 rounded-lg text-sm font-bold hover:opacity-90 transition-opacity">
                Reset Score
            </button>
        </div>

        
        <div id="winnerBanner" class="hidden absolute top-[75px] left-1/2 -translate-x-1/2 bg-yellow-400 border-2 border-yellow-500 text-slate-900 font-black px-6 py-2 rounded-full shadow-lg z-30 text-center animate-bounce text-sm">
            <span id="winnerText">Player Wins!</span>
        </div>

        
        <div id="board" class="grid grid-cols-3 gap-3 w-full aspect-square">

            <div class="cell bg-cellDark w-[100px] h-[100px] min-w-[100px] min-h-[100px] max-w-[100px] max-h-[100px] shrink-0 rounded-2xl flex items-center justify-center cursor-pointer shadow-[inset_0_-4px_0_rgba(0,0,0,0.12)] hover:brightness-105 active:scale-95 transition-all" data-index="0"></div>
            <div class="cell bg-cellDark w-[100px] h-[100px] min-w-[100px] min-h-[100px] max-w-[100px] max-h-[100px] shrink-0 rounded-2xl flex items-center justify-center cursor-pointer shadow-[inset_0_-4px_0_rgba(0,0,0,0.12)] hover:brightness-105 active:scale-95 transition-all" data-index="1"></div>
            <div class="cell bg-cellDark w-[100px] h-[100px] min-w-[100px] min-h-[100px] max-w-[100px] max-h-[100px] shrink-0 rounded-2xl flex items-center justify-center cursor-pointer shadow-[inset_0_-4px_0_rgba(0,0,0,0.12)] hover:brightness-105 active:scale-95 transition-all" data-index="2"></div>

            <div class="cell bg-cellDark w-[100px] h-[100px] min-w-[100px] min-h-[100px] max-w-[100px] max-h-[100px] shrink-0 rounded-2xl flex items-center justify-center cursor-pointer shadow-[inset_0_-4px_0_rgba(0,0,0,0.12)] hover:brightness-105 active:scale-95 transition-all" data-index="3"></div>
            <div class="cell bg-cellDark w-[100px] h-[100px] min-w-[100px] min-h-[100px] max-w-[100px] max-h-[100px] shrink-0 rounded-2xl flex items-center justify-center cursor-pointer shadow-[inset_0_-4px_0_rgba(0,0,0,0.12)] hover:brightness-105 active:scale-95 transition-all" data-index="4"></div>
            <div class="cell bg-cellDark w-[100px] h-[100px] min-w-[100px] min-h-[100px] max-w-[100px] max-h-[100px] shrink-0 rounded-2xl flex items-center justify-center cursor-pointer shadow-[inset_0_-4px_0_rgba(0,0,0,0.12)] hover:brightness-105 active:scale-95 transition-all" data-index="5"></div>

            <div class="cell bg-cellDark w-[100px] h-[100px] min-w-[100px] min-h-[100px] max-w-[100px] max-h-[100px] shrink-0 rounded-2xl flex items-center justify-center cursor-pointer shadow-[inset_0_-4px_0_rgba(0,0,0,0.12)] hover:brightness-105 active:scale-95 transition-all" data-index="6"></div>
            <div class="cell bg-cellDark w-[100px] h-[100px] min-w-[100px] min-h-[100px] max-w-[100px] max-h-[100px] shrink-0 rounded-2xl flex items-center justify-center cursor-pointer shadow-[inset_0_-4px_0_rgba(0,0,0,0.12)] hover:brightness-105 active:scale-95 transition-all" data-index="7"></div>
            <div class="cell bg-cellDark w-[100px] h-[100px] min-w-[100px] min-h-[100px] max-w-[100px] max-h-[100px] shrink-0 rounded-2xl flex items-center justify-center cursor-pointer shadow-[inset_0_-4px_0_rgba(0,0,0,0.12)] hover:brightness-105 active:scale-95 transition-all" data-index="8"></div>
            
        </div>

        
        <div class="w-full flex flex-col gap-1">
            <div class="flex justify-between text-[#2b5467] font-black text-xs px-2">
                <span id="p1NameDisplay" class="truncate max-w-[120px]">PLAYER 1</span>
                <span id="p2NameDisplay" class="truncate max-w-[120px]">BOT</span>
            </div>
            
            <div class="flex justify-between w-full">
                
                <div class="bg-[#3b6c82] rounded-xl p-2 flex items-center gap-1.5 w-[48%] shadow-[inset_0_2px_4px_rgba(0,0,0,0.15)]">
                    <div class="bg-[#2b5467] rounded-lg w-[50px] h-[50px] flex items-center justify-center">
                        <span id="p1MiniSymbol" class="text-pX text-5xl font-black leading-none drop-shadow-[0_4px_0_#d64875] scale-110">X</span>
                    </div>
                    <div class="grid grid-cols-3 gap-1 flex-grow" id="p1ScoreGrid">
                        <div class="score-dot bg-[#284c5e] h-3.5 rounded flex items-center justify-center text-[10px] font-bold"></div>
                        <div class="score-dot bg-[#284c5e] h-3.5 rounded flex items-center justify-center text-[10px] font-bold"></div>
                        <div class="score-dot bg-[#284c5e] h-3.5 rounded flex items-center justify-center text-[10px] font-bold"></div>
                    </div>
                </div>

                
                <div class="bg-[#3b6c82] rounded-xl p-2 flex items-center gap-1.5 w-[48%] shadow-[inset_0_2px_4px_rgba(0,0,0,0.15)]">
                    <div class="grid grid-cols-3 gap-1 flex-grow" id="p2ScoreGrid">
                        <div class="score-dot bg-[#284c5e] h-3.5 rounded flex items-center justify-center text-[10px] font-bold"></div>
                        <div class="score-dot bg-[#284c5e] h-3.5 rounded flex items-center justify-center text-[10px] font-bold"></div>
                        <div class="score-dot bg-[#284c5e] h-3.5 rounded flex items-center justify-center text-[10px] font-bold"></div>
                    </div>
                    <div class="bg-[#2b5467] rounded-lg w-[50px] h-[50px] flex items-center justify-center">
                        <span id="p2MiniSymbol" class="text-pO text-4xl font-black leading-none drop-shadow-[0_4px_0_#2a9be3]">O</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
