<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SHIFT — Play 2048</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="BoardStyle.css">
<link rel="stylesheet" href="theme.css">
</head>

<body>    
    <header class="navbar">

        <a href="home.html" class="logo">
            <div class="logo-squares">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="logo-text">
                <h2>SHIFT</h2>
                <p>2048 PUZZLE GAME</p>
            </div>
        </a>

        <nav class="nav-links">
            <a href="home.html">HOME</a>
            <a href="board.html" class="active">PLAY</a>
            <a href="feedback.html">FEEDBACK</a>
            <a href="leaderboard.html">LEADERBOARD</a>
        </nav>

        <div class="nav-icons">
            <a href="help.html" class="icon-btn" title="How to play">?</a>
        </div>

    </header>
    
    <main class="game">

        <div class="game-head">

            <div class="game-title">
                <p class="eyebrow">READY TO SHIFT?</p>
                <h1>Think ahead. <span>Make your move.</span></h1>
            </div>

            <div class="stats">

                <div class="stat-card stat-blue">
                    <p class="stat-label">SCORE</p>
                    <span id="score">0</span>
                </div>

                <div class="stat-card stat-purple">
                    <p class="stat-label">BEST</p>
                    <span id="best">0</span>
                </div>

                <div class="stat-card stat-pink">
                    <p class="stat-label">MOVES</p>
                    <span id="moves">0</span>
                </div>

            </div>

        </div>


        <div class="board-wrap">

            <div class="board" id="board">

                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>

                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>

                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>

                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>

            </div>

            <div class="overlay" id="overlay">
                <div class="overlay-card">

                    <h2 id="overlayTitle">GAME OVER</h2>
                    <p id="overlayText">No more moves left.</p>

                    <div class="overlay-stats">
                        <div>
                            <span id="finalScore">0</span>
                            <p>SCORE</p>
                        </div>
                        <div>
                            <span id="finalMoves">0</span>
                            <p>MOVES</p>
                        </div>
                    </div>

                    <div class="overlay-buttons">
                        <button id="overlayRestart">PLAY AGAIN</button>
                        <button id="overlayUndo">UNDO</button>
                    </div>

                </div>
            </div>

        </div>


        <div class="buttons">

            <button id="newGame">NEW GAME</button>

            <button id="undo">UNDO</button>

        </div>

        <p class="hint">Use your ← ↑ → ↓ arrow keys to play</p>

    </main>
    <script src="theme.js"></script>
<script src="music.js?v=2"></script>
<script src="bourdJava.js"></script>

</body>

</html>
