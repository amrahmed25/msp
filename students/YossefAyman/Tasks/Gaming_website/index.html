<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GameNexus | Home</title>

    <link rel="stylesheet" href="./Css/navbar.css">
    <link rel="stylesheet" href="./Css/home.css">

    <script src="Js/navbar.js"></script>
</head>
<body>
    <nav-bar></nav-bar>

    <div class="container">
        <div class="welcome">
            <h1>Discover your next adventures</h1>
            <div class="buttons">
                <button class="browse-button">
                    Explore Games
                </button>

                <button class="join-button">
                    Join Now
                </button>
            </div>
        </div>


        <div class="popular">
            <h2>Trending Games This Week</h2>
            <div class="games">
                <div class="game-card">
                    <img src="./Images/War Zone.jpg" alt="War Zone ">
                    <h3>Warzone X</h3>
                    <p>Action | ⭐️4.2</p>
                    <button class="details-button"> View Details</button>
                </div>

                <div class="game-card">
                    <img src="./Images/Cricket 24.jpg" alt="Cricket 24">
                    <h3>Cricket 24</h3>
                    <p>Sports | ⭐️4.0</p>
                    <button class="details-button"> View Details</button>
                </div>

                <div class="game-card">
                    <img src="./Images/Rocket League.jpg" alt="Rocket League">
                    <h3>Rocket League</h3>
                    <p>Sports | ⭐ 3.5</p>
                    <button class="details-button"> View Details</button>
                </div>
            </div>
        </div>
    </div>

    <script src="./Js/home.js"></script>
</body>
</html>
