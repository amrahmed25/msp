<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#1a2a3a] flex items-center justify-center p-4 font-sans">
    
    <div id="page1" class="w-full max-w-md">
        
        <div class="flex justify-center items-center mb-6">
            <div class="text-4xl font-bold text-white/80 tracking-wider">
                <span class="text-yellow-400">X</span>
                <span class="text-cyan-400">O</span>
            </div>
        </div>

    
       <div class="w-full max-w-md bg-[#1f3640] my-4 p-5 text-center rounded-xl shadow-[0_8px_0_0_rgba(16,33,42,1)]">
       <p class="text-slate-300 font-bold text-lg tracking-wide mb-4">
        PICK PLAYER 1'S MARK
       </p>
    
        <div class="flex gap-2 bg-[#1a2a3a] rounded-xl p-1.5 mb-3">
        <div class="flex-1 py-3 rounded-lg text-3xl font-bold bg-[#1f3640] text-yellow-400 border-2 border-yellow-400 shadow-lg shadow-yellow-400/20 cursor-pointer transition-all hover:scale-105">
            X
        </div>
        <div class="flex-1 py-3 rounded-lg text-3xl font-bold bg-[#1f3640] text-cyan-400/50 cursor-pointer transition-all hover:scale-105">
            O
        </div>
        </div>
    
    
        <p class="text-slate-400 text-sm tracking-wide">
        REMEMBER : X GOES FIRST
        </p>
    
        </div> 
       
               

            <div class="mt-5 space-y-3">
                <button onclick="newGame()" id="newGamePlayerBtn" class="w-full py-4 bg-cyan-400 hover:bg-cyan-300 text-[#1a2a3a] font-bold text-xl rounded-xl shadow-[0_8px_0_0_rgba(17,140,135,1)] transition-all duration-200 hover:translate-y-0.5 active:translate-y-0">
                    NEW GAME (VS PLAYER)
                </button>
            </div>

            
      
        
    </div>
    <script>
        function newGame(){
            window.location.href = 'game.html';
            localStorage.setItem("counterOfX" , 0);
            localStorage.setItem("counterOfTies" , 0);
            localStorage.setItem("counterOfO" , 0);
        }
    </script>
   

</body>
</html>
