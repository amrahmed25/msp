<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <title>Brain Arena - Register</title>
</head>

<body>

    <div class="background">

        <div class="grid"></div>

        <div class="glow glow-purple"></div>
        <div class="glow glow-blue"></div>
        <div class="glow glow-pink"></div>

        <div class="floating-shape shape-one"></div>
        <div class="floating-shape shape-two"></div>
        <div class="floating-shape shape-three"></div>

    </div>


    <div id="containerDiv" class="message-container">

        <div id="messageDiv" class="message-box">

            <p id="message"></p>

        </div>

    </div>

    <main class="container-fluid min-vh-100 d-flex align-items-center justify-content-center py-5">

        <div class="row w-100 justify-content-center">

            <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

                <div class="glass-card register-card">

                    <div class="card-content">


                        <div class="system-status">

                            <span>
                                ARENA SYSTEM
                            </span>

                            <span class="online">
                                ● ONLINE
                            </span>

                        </div>

                        <div class="text-center mb-4">

                            <div class="small-label">
                                NEW PLAYER
                            </div>

                            <h2 id="greeting" class="register-title">
                                Create Account
                            </h2>

                            <p class="register-subtitle">
                                Create your account and enter the arena.
                            </p>

                        </div>

                        <form id="registerForm" onsubmit="return false;">

                            <div id="containerFill">

                                <div class="mb-3">

                                    <label
                                        for="name"
                                        class="input-label"
                                    >
                                        PLAYER NAME
                                    </label>

                                    <input
                                        id="name"
                                        type="text"
                                        class="form-control custom-input w-100"
                                        placeholder="Enter your name"
                                        autocomplete="off"
                                        autofocus
                                    >

                                </div>


                                <div class="mb-3">

                                    <label
                                        for="email"
                                        class="input-label"
                                    >
                                        EMAIL ADDRESS
                                    </label>

                                    <input
                                        id="email"
                                        type="email"
                                        class="form-control custom-input w-100"
                                        placeholder="Enter your email"
                                        autocomplete="off"
                                    >

                                </div>

                                <div class="mb-4">

                                    <label
                                        for="password"
                                        class="input-label"
                                    >
                                        PASSWORD
                                    </label>

                                    <input
                                        id="password"
                                        type="password"
                                        class="form-control custom-input w-100"
                                        placeholder="Create your password"
                                        autocomplete="off"
                                    >

                                </div>

                            </div>

                            <div id="containerButton">

                                <button
                                    id="submitButton"
                                    type="button"
                                    onclick="whenSubmit(event)"
                                    class="btn main-btn w-100"
                                >
                                    CREATE ACCOUNT

                                    <span class="ms-2">
                                        →
                                    </span>

                                </button>

                            </div>

                            <div
                                id="containerP"
                                class="text-center mt-4"
                            >

                                <p class="account-text">

                                    Already have an account?

                                    <a href="login.html">
                                        Sign In
                                    </a>

                                </p>

                            </div>

                            <div class="row g-2 mt-4">


                                <div class="col-4">

                                    <div class="feature-box">

                                        <span>
                                            ⚡
                                        </span>

                                        <strong>
                                            FAST
                                        </strong>

                                        <small>
                                            CHALLENGES
                                        </small>

                                    </div>

                                </div>


                                <div class="col-4">

                                    <div class="feature-box">

                                        <span>
                                            🧠
                                        </span>

                                        <strong>
                                            SMART
                                        </strong>

                                        <small>
                                            QUESTIONS
                                        </small>

                                    </div>

                                </div>


                                <div class="col-4">

                                    <div class="feature-box">

                                        <span>
                                            🏆
                                        </span>

                                        <strong>
                                            RANK
                                        </strong>

                                        <small>
                                            COMPETE
                                        </small>

                                    </div>

                                </div>

                            </div>

                            <div class="login-footer">

                                <span></span>

                                THINK

                                <b>•</b>

                                PLAN

                                <b>•</b>

                                WIN

                                <span></span>

                            </div>


                        </form>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="js/auth.js"></script>

</body>
</html>
