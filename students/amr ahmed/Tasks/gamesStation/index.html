<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/index.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Login</title>
</head>
<body>
    <div id="containerDiv">
        <div id="messageDiv" class="hidden">
            <p id="message"></p>
        </div>
    </div>
    <div id="containerForm">
        <form>
            <h1 id="greeting">Welcome to Games Station</h1>
            <div id="containerFill">
                <div class="containerInput">
                    <label for="name">Name</label><br>
                    <input id="name" type="text" placeholder="Your Name" autofocus autocomplete="off"><br>
                </div>
                <div class="containerInput">
                    <label class=" text-white text-xl" for="email">Email</label><br>
                    <input id="email" type="email" placeholder="Your Email" autocomplete="off"><br>
                </div>
                <div class="containerInput">
                    <label class="text-white text-xl" for="password">Password</label><br>
                    <input id="password" type="password" placeholder="Your Password" autocomplete="off"><br>
                </div>
            </div>
            <div id="containerButton"> 
                <button type="button" onclick="window.location.href='home.html'">
    Submit
</button>
<br> 
            </div>
            <div id="containerP">
                <p><span>Don't have an account?</span><a href="register.html">Click Here</a></p>
            </div>
        </form>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
