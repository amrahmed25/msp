<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel Agency - Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center">

    <div class="w-full max-w-md bg-white p-10 rounded-2xl shadow-xl">

        <h1 class="text-3xl font-bold text-center text-teal-700 mb-2">
            Travel Agency
        </h1>

        <p class="text-center text-gray-500 mb-8">
            Login to start your journey
        </p>

        <form id="loginForm" class="flex flex-col gap-5">
            <div>
                <label class="block mb-2 font-semibold text-gray-700">
                    Full Name
                </label>

                <input
                    id="name"
                    type="text"
                    placeholder="Enter your full name"
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:border-teal-600"
                    required
                >
            </div>

            <div>
                <label class="block mb-2 font-semibold text-gray-700">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="Enter your email"
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:border-teal-600"
                    required
                >
            </div>

            <div>
                <label class="block mb-2 font-semibold text-gray-700">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Enter your password"
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:border-teal-600"
                    required
                >
            </div>

            <button
                type="submit"
                class="bg-teal-700 text-white py-3 rounded-lg font-semibold hover:bg-teal-800 transition cursor-pointer"
            >
                Login
            </button>

        </form>

    </div>

    <script src="script.js"></script>

</body>

</html>
