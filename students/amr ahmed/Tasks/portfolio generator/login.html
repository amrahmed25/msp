<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — PortfolioHub</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-body">

  <div class="auth-split">

    <!-- ===== LEFT PANEL — FORM ===== -->
    <div class="auth-left">
      <div class="auth-form-wrap">

        <!-- Logo -->
        <a href="index.html" class="auth-logo">
          <span class="auth-logo-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18"/><path d="M9 21V9"/></svg></span>
          <span class="auth-logo-text">PortfolioHub</span>
        </a>

        <!-- Heading -->
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Sign in to your account</p>

        <!-- Error Banner -->
        <div id="auth-error" class="auth-error" role="alert" aria-live="polite" hidden>
          <span class="auth-error-icon"><svg class="ph-icon" width="1.1em" height="1.1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9L2 18a2 2 0 0 0 1.7 3h16.6A2 2 0 0 0 22 18L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg></span>
          <span id="auth-error-msg"></span>
        </div>

        <!-- Form -->
        <form id="login-form" class="auth-form" novalidate>

          <!-- Email -->
          <div class="form-group">
            <label for="email" class="form-label">Email address</label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
              </span>
              <input
                type="email"
                id="email"
                name="email"
                class="form-input"
                placeholder="you@example.com"
                autocomplete="email"
                required
              />
            </div>
            <span class="field-error" id="email-error" aria-live="polite"></span>
          </div>

          <!-- Password -->
          <div class="form-group">
            <div class="label-row">
              <label for="password" class="form-label">Password</label>
              <a href="reset-password.html" class="forgot-link">Forgot password?</a>
            </div>
            <div class="input-wrap">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
              <input
                type="password"
                id="password"
                name="password"
                class="form-input"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />
              <button type="button" class="toggle-pw" id="toggle-password" aria-label="Toggle password visibility">
                <svg class="eye-icon show-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-icon hide-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
            <span class="field-error" id="password-error" aria-live="polite"></span>
          </div>

          <!-- Submit -->
          <button type="submit" id="login-btn" class="btn btn-primary btn-full btn-auth">
            <span class="btn-text">Sign In</span>
            <span class="btn-spinner" hidden>
              <svg class="spinner-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
              Signing in…
            </span>
          </button>

        </form>

        <!-- Divider -->
        <div class="auth-divider"><span>or</span></div>

        <!-- Sign Up Link -->
        <p class="auth-switch">
          Don't have an account?
          <a href="signup.html" class="auth-link">Sign up</a>
        </p>

      </div>
    </div>

    <!-- ===== RIGHT PANEL — DECORATIVE ===== -->
    <div class="auth-right auth-right--login">
      <div class="auth-right-inner">

        <blockquote class="auth-quote">
          <p>"Your portfolio is your story — tell it with confidence."</p>
          <footer>— PortfolioHub Team</footer>
        </blockquote>

        <div class="auth-stats">
          <div class="stat-badge">
            <span class="stat-icon"><svg class="ph-icon" width="1.1em" height="1.1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></span>
            <div>
              <strong>10,000+</strong>
              <span>professionals trust us</span>
            </div>
          </div>
          <div class="stat-badge">
            <span class="stat-icon"><svg class="ph-icon" width="1.1em" height="1.1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></span>
            <div>
              <strong>50,000+</strong>
              <span>portfolios created</span>
            </div>
          </div>
          <div class="stat-badge">
            <span class="stat-icon"><svg class="ph-icon" width="1.1em" height="1.1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span>
            <div>
              <strong>120+</strong>
              <span>countries represented</span>
            </div>
          </div>
        </div>

        <!-- Decorative portfolio card mockup -->
        <div class="portfolio-card-mockup">
          <div class="mockup-header">
            <div class="mockup-avatar"></div>
            <div class="mockup-info">
              <div class="mockup-line mockup-line--name"></div>
              <div class="mockup-line mockup-line--role"></div>
            </div>
          </div>
          <div class="mockup-tags">
            <span class="mockup-tag">React</span>
            <span class="mockup-tag">Node.js</span>
            <span class="mockup-tag">UI/UX</span>
          </div>
          <div class="mockup-projects">
            <div class="mockup-project-card"></div>
            <div class="mockup-project-card"></div>
          </div>
        </div>

      </div>
    </div>

  </div>

  <script src="js/config.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module">
    import { initLoginPage } from './js/auth.js';
    initLoginPage();
  </script>
</body>
</html>
