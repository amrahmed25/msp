<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="index.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <title>Login</title>

</head>


<body
    class="
        min-h-screen
        overflow-x-hidden
        bg-[#02040a]
        text-white
    "
>


 

    <div
        class="
            fixed
            inset-0
            bg-[#02040a]
            -z-10
        "
    >


        <div
            class="
                absolute
                inset-0
                bg-[radial-gradient(circle_at_20%_50%,rgba(255,0,70,.22),transparent_35%),radial-gradient(circle_at_85%_50%,rgba(0,140,255,.22),transparent_35%)]
            "
        ></div>


      

        <img
            src="./xxxxx.png.png"
            alt=""
            class="
                absolute
                inset-0
                w-full
                h-full
                object-cover
                object-center
                opacity-35
                blur-[10px]
                scale-105
            "
        >



        <div
            class="
                absolute
                inset-0
                bg-black/50
            "
        ></div>

    </div>



    <div
        id="containerDiv"
        class="
            absolute
            top-5
            left-1/2
            -translate-x-1/2
            z-50
        "
    >

        <div
            id="messageDiv"
            class="
                hidden
                px-6
                py-3
                rounded-xl
                border
                border-red-500/30
                bg-slate-900/80
                backdrop-blur-xl
                shadow-[0_0_30px_rgba(255,0,60,.25)]
            "
        >

            <p
                id="message"
                class="
                    text-sm
                    text-white
                "
            ></p>

        </div>

    </div>



  

    <div
        id="containerForm"
        class="
            min-h-screen
            w-full
            flex
            items-center
            justify-center
            px-5
            py-10
        "
    >


        <form
            class="
                relative
                isolate
                w-full
                max-w-[390px]

                rounded-2xl

                border
                border-white/15

                bg-slate-900/65

                backdrop-blur-2xl

                px-6
                py-7

                shadow-[0_0_50px_rgba(0,0,0,.55)]

                overflow-hidden
            "
        >



            <div
                class="
                    absolute
                    inset-0
                    rounded-2xl
                    border
                    border-transparent
                    bg-gradient-to-br
                    from-red-500/50
                    via-transparent
                    to-blue-500/50
                    opacity-80
                    pointer-events-none
                "
            ></div>




            <div
                class="
                    absolute
                    left-[-100px]
                    top-[100px]
                    w-[250px]
                    h-[250px]
                    rounded-full
                    bg-red-600/10
                    blur-[100px]
                    pointer-events-none
                "
            ></div>




            <div
                class="
                    absolute
                    right-[-100px]
                    bottom-[-50px]
                    w-[250px]
                    h-[250px]
                    rounded-full
                    bg-blue-600/10
                    blur-[100px]
                    pointer-events-none
                "
            ></div>



          

            <h1
                id="greeting"
                class="
                    relative
                    z-10

                    text-center

                    text-[26px]
                    leading-tight

                    font-bold

                    text-white

                    mb-2
                "
            >
                Welcome to Games Station
            </h1>




            <div
                id="containerFill"
                class="
                    relative
                    z-10

                    flex
                    flex-col

                    gap-4

                    mt-7
                "
            >


                

                <div
                    class="
                        containerInput
                        w-full
                    "
                >

                    <label
                        for="name"
                        class="
                            text-white
                            text-sm
                            font-medium
                        "
                    >
                        Name
                    </label>

                    <br>

                    <input
                        id="name"
                        type="text"
                        placeholder="Your Name"
                        autofocus
                        autocomplete="off"
                        class="
                            w-full
                            h-12

                            mt-1

                            rounded-lg

                            border
                            border-white/15

                            bg-white/10

                            px-4

                            text-white
                            text-base

                            placeholder:text-white/40

                            outline-none

                            transition-all
                            duration-300

                            focus:border-red-400

                            focus:bg-white/[0.13]

                            focus:shadow-[0_0_20px_rgba(255,0,60,.2)]
                        "
                    >

                    <br>

                </div>




                <div
                    class="
                        containerInput
                        w-full
                    "
                >

                    <label
                        class="
                            text-white
                            text-sm
                            font-medium
                        "
                        for="email"
                    >
                        Email
                    </label>

                    <br>

                    <input
                        id="email"
                        type="email"
                        placeholder="Your Email"
                        autocomplete="off"
                        class="
                            w-full
                            h-12

                            mt-1

                            rounded-lg

                            border
                            border-white/15

                            bg-white/10

                            px-4

                            text-white
                            text-base

                            placeholder:text-white/40

                            outline-none

                            transition-all
                            duration-300

                            focus:border-blue-400

                            focus:bg-white/[0.13]

                            focus:shadow-[0_0_20px_rgba(0,140,255,.2)]
                        "
                    >

                    <br>

                </div>




                <div
                    class="
                        containerInput
                        w-full
                    "
                >

                    <label
                        class="
                            text-white
                            text-sm
                            font-medium
                        "
                        for="password"
                    >
                        Password
                    </label>

                    <br>

                    <input
                        id="password"
                        type="password"
                        placeholder="Your Password"
                        autocomplete="off"
                        class="
                            w-full
                            h-12

                            mt-1

                            rounded-lg

                            border
                            border-white/15

                            bg-white/10

                            px-4

                            text-white
                            text-base

                            placeholder:text-white/40

                            outline-none

                            transition-all
                            duration-300

                            focus:border-red-400

                            focus:bg-white/[0.13]

                            focus:shadow-[0_0_20px_rgba(255,0,60,.2)]
                        "
                    >

                    <br>

                </div>


            </div>



          

            <div
                id="containerButton"
                class="
                    relative
                    z-10

                    w-full

                    mt-3
                "
            >

                <button
                    type="button"
                    onclick="whenSubmit(event)"
                    class="
                        relative

                        flex
                        items-center
                        justify-center

                        w-full
                        h-13

                        rounded-lg

                        border
                        border-white/10

                        overflow-hidden

                        font-semibold
                        text-white
                        text-base

                        cursor-pointer

                        bg-gradient-to-r
                        from-red-600
                        via-red-500
                        to-blue-500

                        shadow-[0_0_25px_rgba(255,0,60,.35)]

                        transition-all
                        duration-300

                        hover:scale-[1.01]

                        hover:shadow-[0_0_35px_rgba(0,140,255,.45)]

                        active:scale-[.98]
                    "
                >
                    Submit
                </button>

                <br>

            </div>



            

            <div
                id="containerP"
                class="
                    relative
                    z-10

                    mt-3

                    text-center
                "
            >

                <p
                    class="
                        text-sm
                        text-white/50
                    "
                >

                    <span>
                        Don't have an account?
                    </span>

                    <a
                        href="register.html"
                        class="
                            ml-1

                            font-semibold

                            text-blue-400

                            hover:text-red-400

                            transition-colors
                            duration-300
                        "
                    >
                        Click Here
                    </a>

                </p>

            </div>


        </form>

    </div>



   

    <script src="js/auth.js"></script>

</body>

</html>
