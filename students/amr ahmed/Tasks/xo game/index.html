<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="register.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <title>Register</title>


    <style>

       

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }


        body {
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
        }



     

        .main-card {

            width: 100%;

            max-width: 1180px;

            min-height: 760px;

            position: relative;

            overflow: hidden;

            border-radius: 6px;
        }




        .register-card-wrapper {

            position: absolute;

            top: 50%;

            right: 5%;

            transform: translateY(-50%);

            width: 390px;

            max-width: 90%;

            z-index: 20;
        }



       

        #containerForm {

            width: 100% !important;

            height: auto !important;

            min-height: 0 !important;

            max-height: none !important;
        }




        #containerForm form {

            position: relative !important;

            width: 100% !important;

            height: auto !important;

            min-height: 0 !important;

            max-height: none !important;

            box-sizing: border-box !important;

            display: block !important;

            overflow: hidden !important;

            padding: 24px !important;
        }




        #containerForm form > div.relative.z-10 {

            position: relative;

            z-index: 10;

            width: 100%;

            height: auto;

            box-sizing: border-box;
        }




        #containerForm form .mb-3 {

            margin-bottom: 8px !important;
        }



       

        #greeting {

            font-size: 26px !important;

            line-height: 1.2 !important;

            margin: 0 !important;
        }



        

        #greeting + p {

            margin-top: 8px !important;

            margin-bottom: 22px !important;

            font-size: 14px !important;
        }




        #containerFill {

            position: relative;

            z-index: 10;

            width: 100%;

            display: flex !important;

            flex-direction: column !important;

            gap: 12px !important;

            margin: 0 !important;

        }




        .containerInput {

            width: 100% !important;

            height: 48px !important;

            min-height: 48px !important;

            max-height: 48px !important;

            margin: 0 !important;
        }



     

        .containerInput input {

            display: block !important;

            width: 100% !important;

            height: 48px !important;

            min-height: 48px !important;

            max-height: 48px !important;

            box-sizing: border-box !important;

            margin: 0 !important;

            padding-left: 14px !important;

            padding-right: 14px !important;

            font-size: 16px !important;
        }



       

        #containerButton {

            position: relative !important;

            z-index: 50 !important;

            display: block !important;

            width: 100% !important;

            height: 52px !important;

            min-height: 52px !important;

            max-height: 52px !important;

            margin-top: 18px !important;

            margin-bottom: 0 !important;

            padding: 0 !important;

            box-sizing: border-box !important;

            visibility: visible !important;

            opacity: 1 !important;

            overflow: visible !important;
        }



    

        #submitButton {

            position: relative !important;

            z-index: 999 !important;

            display: flex !important;

            align-items: center !important;

            justify-content: center !important;

            width: 100% !important;

            height: 52px !important;

            min-height: 52px !important;

            max-height: 52px !important;

            margin: 0 !important;

            padding: 0 !important;

            box-sizing: border-box !important;

            visibility: visible !important;

            opacity: 1 !important;
        }



        #submitButton > span {

            position: relative;

            z-index: 1000;

            width: 100%;

            height: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;
        }



        

        #containerP {

            position: relative;

            z-index: 10;

            width: 100%;

            margin-top: 18px !important;
        }



        #containerP p {

            margin: 0 !important;

            font-size: 13px !important;
        }



      

        #containerP + div {

            position: relative;

            z-index: 10;

            margin-top: 18px !important;

            font-size: 9px !important;
        }



        
        #containerForm form > .absolute {

            pointer-events: none;
        }



      

        @media (max-width: 767px) {

            body {
                overflow-y: auto;
            }


            .main-card {

                min-height: 100vh;

                border-radius: 0;
            }


            .register-card-wrapper {

                position: absolute;

                top: 50%;

                right: 50%;

                transform: translate(50%, -50%);

                width: 390px;

                max-width: 90%;
            }


            #containerForm form {

                padding: 22px !important;
            }


            #greeting {

                font-size: 24px !important;
            }

        }

    </style>

</head>



<body
    class="
        min-h-screen
        bg-[#02040a]
        text-white
    "
>


   

    <div
        class="
            fixed
            inset-0
            bg-[#02040a]
        "
    >


  

        <div
            class="
                absolute
                inset-0
                bg-[radial-gradient(circle_at_20%_50%,rgba(255,0,70,.22),transparent_35%),radial-gradient(circle_at_85%_50%,rgba(0,140,255,.22),transparent_35%)]
            "
        ></div>




        <img
            src="./xxxxx.png.png"
            alt=""
            class="
                absolute
                inset-0
                w-full
                h-full
                object-cover
                object-center
                opacity-30
                blur-[10px]
                scale-105
            "
        >



     

        <div
            class="
                absolute
                inset-0
                bg-black/45
            "
        ></div>


    </div>



    

    <div
        id="containerDiv"
        class="
            absolute
            top-5
            left-1/2
            -translate-x-1/2
            z-50
        "
    >

        <div
            id="messageDiv"
            class="
                hidden
                px-6
                py-3
                rounded-xl
                bg-slate-900/80
                border
                border-red-500/30
                backdrop-blur-xl
                shadow-[0_0_30px_rgba(255,0,60,.25)]
            "
        >

            <p id="message"></p>

        </div>

    </div>



  

    <div
        class="
            relative
            z-10
            min-h-screen
            flex
            items-center
            justify-center
            px-6
            py-10
        "
    >


        <div
            class="
                main-card
                border
                border-white/10
                bg-black/20
                shadow-[0_0_80px_rgba(0,0,0,.65)]
            "
        >




            <nav
                class="
                    absolute
                    top-0
                    left-0
                    right-0
                    z-40
                    h-[82px]
                    flex
                    items-center
                    justify-between
                    px-10
                "
            >


                

                <div
                    class="
                        flex
                        items-center
                        gap-2
                    "
                >

                    <span
                        class="
                            text-4xl
                            font-black
                            italic
                            text-red-500
                            drop-shadow-[0_0_12px_rgba(255,0,60,.9)]
                        "
                    >
                        X
                    </span>


                    <span
                        class="
                            text-3xl
                            font-black
                            text-blue-400
                            drop-shadow-[0_0_12px_rgba(0,140,255,.9)]
                        "
                    >
                        O
                    </span>

                </div>



               

                <div
                    class="
                        hidden
                        md:flex
                        items-center
                        gap-8
                        text-sm
                        text-white/70
                    "
                >

                    <a
                        href="#"
                        class="hover:text-white transition"
                    >
                        Home
                    </a>


                    <a
                        href="#"
                        class="hover:text-white transition"
                    >
                        About
                    </a>


                    <a
                        href="#"
                        class="hover:text-white transition"
                    >
                        Leaderboard
                    </a>


                    <a
                        href="#"
                        class="hover:text-white transition"
                    >
                        Play
                    </a>


                    <a
                        href="#"
                        class="hover:text-white transition"
                    >
                        Contact
                    </a>

                </div>



               

                <div
                    class="
                        flex
                        items-center
                        gap-5
                        text-sm
                    "
                >

                    <span class="text-white/70">
                        🌐 English
                    </span>


                    <span class="text-white/20">
                        |
                    </span>


                    <a
                        href="login.html"
                        class="
                            text-white/80
                            hover:text-white
                            transition
                        "
                    >
                        Sign In
                    </a>


                    <span
                        class="
                            px-4
                            py-2
                            rounded-full
                            border
                            border-red-500
                            text-white
                            bg-white/5
                            shadow-[0_0_18px_rgba(255,0,60,.4)]
                        "
                    >
                        Register
                    </span>

                </div>

            </nav>



            

            <img
                src="xxxxx.png.png"
                alt="XO Game"
                class="
                    absolute
                    inset-0
                    w-full
                    h-full
                    object-cover
                    object-center
                    z-0
                "
            >



            

            <div
                class="
                    absolute
                    inset-0
                    z-[1]
                    bg-black/20
                "
            ></div>



        

            <div
                class="
                    absolute
                    inset-0
                    z-[2]
                    bg-gradient-to-br
                    from-red-900/10
                    via-transparent
                    to-blue-900/15
                    pointer-events-none
                "
            ></div>



         

            <div
                class="
                    register-card-wrapper
                "
            >


                <div
                    id="containerForm"
                    class="w-full"
                >


                    <form
                        class="
                            relative
                            isolate
                            w-full
                            rounded-2xl
                            border
                            border-white/15
                            bg-slate-900/65
                            backdrop-blur-2xl
                            shadow-[0_0_50px_rgba(0,0,0,.55)]
                        "
                    >



                        
                        <div
                            class="
                                absolute
                                inset-0
                                z-0
                                pointer-events-none
                                rounded-2xl
                                border
                                border-transparent
                                bg-gradient-to-br
                                from-red-500/50
                                via-transparent
                                to-blue-500/50
                                opacity-80
                            "
                        ></div>




                        <div
                            class="
                                absolute
                                left-[-100px]
                                top-[100px]
                                w-[250px]
                                h-[250px]
                                z-0
                                bg-red-600/10
                                blur-[100px]
                                rounded-full
                                pointer-events-none
                            "
                        ></div>



                    

                        <div
                            class="
                                absolute
                                right-[-100px]
                                bottom-[50px]
                                w-[250px]
                                h-[250px]
                                z-0
                                bg-blue-600/10
                                blur-[100px]
                                rounded-full
                                pointer-events-none
                            "
                        ></div>



                       

                        <div
                            class="
                                relative
                                z-10
                                w-full
                            "
                        >



                           

                            <div
                                class="
                                    relative
                                    flex
                                    justify-center
                                    items-center
                                    gap-2
                                    mb-3
                                "
                            >

                                <span
                                    class="
                                        text-3xl
                                        font-black
                                        italic
                                        text-red-500
                                        drop-shadow-[0_0_12px_rgba(255,0,60,.9)]
                                    "
                                >
                                    X
                                </span>


                                <span
                                    class="
                                        text-2xl
                                        text-white/40
                                    "
                                >
                                    |
                                </span>


                                <span
                                    class="
                                        text-3xl
                                        font-black
                                        text-blue-400
                                        drop-shadow-[0_0_12px_rgba(0,140,255,.9)]
                                    "
                                >
                                    O
                                </span>

                            </div>




                            <h1
                                id="greeting"
                                class="
                                    relative
                                    text-center
                                    font-bold
                                    text-white
                                "
                            >
                                Create Account
                            </h1>



                           

                            <p
                                class="
                                    text-center
                                    text-white/50
                                "
                            >
                                Join the game and start playing
                            </p>



                         

                            <div
                                id="containerFill"
                            >



                               

                                <div class="containerInput">

                                    <input
                                        id="name"
                                        type="text"
                                        placeholder="Enter Name"
                                        autofocus
                                        autocomplete="off"
                                        class="
                                            w-full
                                            rounded-lg
                                            border
                                            border-white/15
                                            bg-white/10
                                            text-white
                                            placeholder:text-white/40
                                            outline-none
                                            transition-all
                                            duration-300
                                            focus:border-red-400
                                            focus:bg-white/[0.13]
                                            focus:shadow-[0_0_20px_rgba(255,0,60,.2)]
                                        "
                                    >

                                </div>



                               

                                <div class="containerInput">

                                    <input
                                        id="email"
                                        type="email"
                                        placeholder="Enter Email"
                                        autocomplete="off"
                                        class="
                                            w-full
                                            rounded-lg
                                            border
                                            border-white/15
                                            bg-white/10
                                            text-white
                                            placeholder:text-white/40
                                            outline-none
                                            transition-all
                                            duration-300
                                            focus:border-blue-400
                                            focus:bg-white/[0.13]
                                            focus:shadow-[0_0_20px_rgba(0,140,255,.2)]
                                        "
                                    >

                                </div>



                              

                                <div class="containerInput">

                                    <input
                                        id="password"
                                        type="password"
                                        placeholder="Enter Password"
                                        autocomplete="off"
                                        class="
                                            w-full
                                            rounded-lg
                                            border
                                            border-white/15
                                            bg-white/10
                                            text-white
                                            placeholder:text-white/40
                                            outline-none
                                            transition-all
                                            duration-300
                                            focus:border-red-400
                                            focus:bg-white/[0.13]
                                            focus:shadow-[0_0_20px_rgba(255,0,60,.2)]
                                        "
                                    >

                                </div>


                            </div>




                            <div
                                id="containerButton"
                            >

                                <button
                                    id="submitButton"
                                    type="button"
                                    onclick="whenSubmit(event)"
                                    class="
                                        rounded-lg
                                        border
                                        border-white/10
                                        overflow-hidden
                                        font-semibold
                                        text-white
                                        cursor-pointer
                                        bg-gradient-to-r
                                        from-red-600
                                        via-red-500
                                        to-blue-500
                                        shadow-[0_0_25px_rgba(255,0,60,.35)]
                                        transition-all
                                        duration-300
                                        hover:scale-[1.01]
                                        hover:shadow-[0_0_35px_rgba(0,140,255,.45)]
                                        active:scale-[.98]
                                    "
                                >

                                    <span>

                                        <span>
                                            Create Account
                                        </span>

                                        <span class="text-xl">
                                            →
                                        </span>

                                    </span>

                                </button>

                            </div>



                           

                            <div
                                id="containerP"
                            >

                                <p
                                    class="
                                        text-center
                                        text-white/50
                                    "
                                >

                                    Already have an account?

                                    <a
                                        href="login.html"
                                        class="
                                            ml-1
                                            font-semibold
                                            text-blue-400
                                            hover:text-red-400
                                            transition
                                        "
                                    >
                                        Sign In
                                    </a>

                                </p>

                            </div>



                          

                            <div
                                class="
                                    relative
                                    z-10
                                    flex
                                    items-center
                                    justify-center
                                    gap-3
                                    text-[10px]
                                    tracking-[.3em]
                                    text-white/35
                                "
                            >

                                <span
                                    class="
                                        w-10
                                        h-px
                                        bg-gradient-to-r
                                        from-transparent
                                        to-red-500/70
                                    "
                                ></span>


                                THINK


                                <span class="text-red-400">
                                    •
                                </span>


                                PLAN


                                <span class="text-blue-400">
                                    •
                                </span>


                                WIN


                                <span
                                    class="
                                        w-10
                                        h-px
                                        bg-gradient-to-r
                                        from-blue-500/70
                                        to-transparent
                                    "
                                ></span>

                            </div>


                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>



   
  

    <script src="js/auth.js"></script>

</body>

</html>
