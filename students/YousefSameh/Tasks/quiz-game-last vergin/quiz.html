<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizStage — Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/quiz.css">
</head>
<body>

<div class="fx-flash" id="fxFlash"></div>
<div class="fx-shards" id="fxShards"></div>


<div class="setup-overlay" id="setupOverlay">
  <div class="setup-card">
    <h2>Set up your quiz</h2>
    <p class="setup-sub">Pick a category, a difficulty and how many questions you want.</p>

    <div class="setup-group">
      <label>Category</label>
      <div class="chip-row" id="categoryChips">
        <button type="button" class="chip active" data-cat="technology">Technology</button>
        <button type="button" class="chip" data-cat="science">Science</button>
        <button type="button" class="chip" data-cat="movies">Movies</button>
        <button type="button" class="chip" data-cat="sports">Sports</button>
        <button type="button" class="chip" data-cat="music">Music</button>
        <button type="button" class="chip" data-cat="general">General</button>
      </div>
    </div>

    <div class="setup-group">
      <label>Difficulty</label>
      <div class="chip-row" id="difficultyChips">
        <button type="button" class="chip active" data-diff="easy">Easy</button>
        <button type="button" class="chip" data-diff="medium">Medium</button>
        <button type="button" class="chip" data-diff="hard">Hard</button>
        <button type="button" class="chip" data-diff="extreme">Extreme</button>
      </div>
    </div>

    <div class="setup-group">
      <label>Number of questions: <span id="qCountLabel">10</span></label>
      <input type="range" min="5" max="20" step="1" value="10" id="qCountRange" class="form-range">
    </div>

    <button class="start-btn" id="startQuizBtn">Start Quiz</button>
  </div>
</div>


<div class="quiz-stage" id="quizStage">

  <div class="stage-topbar">
    <a href="categories.html" id="backBtn" class="hex-btn back-btn">
      <span class="hex-shape"></span>
      <span class="hex-label">← Categories</span>
    </a>

    <div class="hex-btn level-badge">
      <span class="hex-shape"></span>
      <span class="hex-label"><i class="level-icon">▂▅█</i> LEVEL <b id="levelText">EASY</b></span>
    </div>

    <div class="progress-pod">
      <div class="progress-pod-label">Question <span id="qIndex">1</span> / <span id="qTotal">10</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div class="timer-ring">
      <svg viewBox="0 0 120 120">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff8a00"/>
            <stop offset="100%" stop-color="#a020f0"/>
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
        <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="52"></circle>
      </svg>
      <div class="ring-center">
        <span id="timerNum">15</span>
        <small>SECONDS</small>
      </div>
    </div>
  </div>

  <div class="question-zone">
    <div class="question-hex">
      <div class="question-eyebrow">— QUESTION <span id="qNum">01</span> —</div>
      <div class="question-text" id="questionText">Loading question…</div>
    </div>

    <div class="answers-grid" id="answersGrid">
    </div>
  </div>

  <div class="stage-bottombar">
    <button class="hex-btn nav-btn" id="prevBtn">
      <span class="hex-shape"></span>
      <span class="hex-label">← Previous</span>
    </button>

    <div class="score-pill" id="scorePill">Score: <b id="scoreNum">0</b></div>

    <button class="hex-btn nav-btn accent" id="nextBtn">
      <span class="hex-shape"></span>
      <span class="hex-label">Next →</span>
    </button>
  </div>

</div>


<div class="results-overlay hidden" id="resultsOverlay">
  <div class="results-card">
    <div class="results-medal" id="resultsMedal">🏆</div>
    <h2 id="resultsGreeting">Great job!</h2>
    <p class="results-sub" id="resultsSub">You scored</p>
    <div class="results-score"><span id="finalScore">0</span> / <span id="finalTotal">10</span></div>
    <div class="results-stats">
      <div class="rstat"><b id="statAccuracy">0%</b><small>Accuracy</small></div>
      <div class="rstat"><b id="statBest">0</b><small>Best score</small></div>
      <div class="rstat"><b id="statPlayed">0</b><small>Quizzes played</small></div>
    </div>
    <div class="results-actions">
      <button class="start-btn" id="playAgainBtn">Play Again</button>
      <a href="profile.html" class="ghost-btn">Back to Profile</a>
    </div>
  </div>
</div>

<canvas id="confettiCanvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/quiz.js"></script>
</body>
</html>
